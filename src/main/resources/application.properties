# PostgreSQL Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/streamswitch2_db
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:changeme}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# Initialize data.sql after Hibernate creates tables
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
spring.sql.init.schema-locations=

# Throw exceptions for missing endpoints (enables 404 responses)
spring.mvc.throw-exception-if-no-handler-found=true
spring.web.resources.add-mappings=false

# Server Port
server.port=8080
